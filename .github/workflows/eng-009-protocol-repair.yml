name: ENG-009 protocol repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/ENG-009-jsonl-error-resilience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply protocol resilience changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          host = Path("crates/engine_agent_host/src/lib.rs")
          text = host.read_text()
          old = '''        session.actions_used += 1;
        let result = self.dispatch(session, &call);
        if result.status == ToolResultStatus::Failed {
            session.status = SessionStatus::Failed;
            session.final_summary = Some(error_message(&result));
        }
        record_action(session, call, result.clone());
        result
'''
          new = '''        session.actions_used += 1;
        let result = self.dispatch(session, &call);
        record_action(session, call, result.clone());
        result
'''
          if text.count(old) != 1:
              raise SystemExit("agent execute status block not found")
          text = text.replace(old, new, 1)

          old = '''                return failed(
                    call,
                    AGENT_TOOL_NOT_FOUND,
                    format!("tool not found: {}", call.tool),
                    json!({"tool": call.tool}),
                )
'''
          new = '''                return rejected(
                    call,
                    AGENT_TOOL_NOT_FOUND,
                    format!("tool not found: {}", call.tool),
                    json!({"tool": call.tool}),
                )
'''
          if text.count(old) != 1:
              raise SystemExit("unknown-tool block not found")
          text = text.replace(old, new, 1)

          start = text.index("fn error_message(result: &ToolResult) -> String {")
          end = text.index("fn rejected(", start)
          text = text[:start] + text[end:]

          old = '''    #[test]
    fn failed_calls_are_recorded_and_fail_the_session() {
        let mut host = host();
        let mut session = session(PermissionSet::read_only());
        let result = host.execute(
            &mut session,
            ToolCall {
                id: "call-missing".into(),
                tool: ToolId::from_static("missing.tool"),
                input: json!({}),
                dry_run: false,
            },
        );
        assert_eq!(result.status, ToolResultStatus::Failed);
        assert_eq!(error_code(&result), Some(AGENT_TOOL_NOT_FOUND));
        assert_eq!(session.actions.len(), 1);
        assert_eq!(session.status, SessionStatus::Failed);
    }
'''
          new = '''    #[test]
    fn unknown_tools_are_rejected_recorded_and_do_not_stop_the_session() {
        let mut host = host();
        let mut session = session(PermissionSet::read_only());
        let result = host.execute(
            &mut session,
            ToolCall {
                id: "call-missing".into(),
                tool: ToolId::from_static("missing.tool"),
                input: json!({}),
                dry_run: false,
            },
        );
        assert_eq!(result.status, ToolResultStatus::Rejected);
        assert_eq!(error_code(&result), Some(AGENT_TOOL_NOT_FOUND));
        assert_eq!(session.actions.len(), 1);
        assert_eq!(session.status, SessionStatus::Running);
        let following = host.execute(&mut session, list_call("call-after"));
        assert_eq!(following.status, ToolResultStatus::Ok);
        assert_eq!(session.actions.len(), 2);
    }
'''
          if text.count(old) != 1:
              raise SystemExit("unknown-tool test block not found")
          text = text.replace(old, new, 1)
          host.write_text(text)

          editor = Path("crates/engine_editor/src/main.rs")
          text = editor.read_text()
          text = text.replace(
              "use guiyi_engine_protocol::{decode_line, encode_line, ToolCall, ToolResult, ToolResultStatus};",
              "use guiyi_engine_protocol::{encode_line, ToolCall, ToolResult, ToolResultStatus};",
              1,
          )
          old = '''fn execute_line(host: &mut AgentHost, session: &mut AgentSession, line: &str) -> ToolResult {
    match decode_line::<ToolCall>(line) {
        Ok(call) => host.execute(session, call),
        Err(error) => ToolResult {
            call_id: "invalid".into(),
            status: ToolResultStatus::Failed,
            output: json!({
                "error": {
                    "code": "PROTOCOL_INVALID_JSONL",
                    "message": error.to_string()
                }
            }),
            diagnostics: Vec::new(),
            transaction: None,
        },
    }
}
'''
          new = '''fn execute_line(host: &mut AgentHost, session: &mut AgentSession, line: &str) -> ToolResult {
    let value = match serde_json::from_str::<serde_json::Value>(line) {
        Ok(value) => value,
        Err(error) => {
            return protocol_error("invalid", "PROTOCOL_INVALID_JSONL", error.to_string())
        }
    };
    let call_id = value
        .get("id")
        .and_then(serde_json::Value::as_str)
        .unwrap_or("invalid")
        .to_string();
    match serde_json::from_value::<ToolCall>(value) {
        Ok(call) => host.execute(session, call),
        Err(error) => protocol_error(&call_id, "PROTOCOL_INVALID_CALL", error.to_string()),
    }
}

fn protocol_error(call_id: &str, code: &str, message: String) -> ToolResult {
    ToolResult {
        call_id: call_id.into(),
        status: ToolResultStatus::Rejected,
        output: json!({
            "error": {
                "code": code,
                "message": message
            }
        }),
        diagnostics: Vec::new(),
        transaction: None,
    }
}
'''
          if text.count(old) != 1:
              raise SystemExit("Workbench execute_line block not found")
          editor.write_text(text.replace(old, new, 1))
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit protocol changes
        run: |
          if git diff --quiet; then
            echo "protocol repair made no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(protocol): keep Workbench alive after tool errors"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
