name: ENG-009 protocol repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/ENG-009-jsonl-error-resilience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply protocol resilience changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          host = Path("crates/engine_agent_host/src/lib.rs")
          lines = host.read_text().splitlines(keepends=True)

          start = next(i for i, line in enumerate(lines) if "session.actions_used += 1;" in line)
          if "let result = self.dispatch" not in lines[start + 1]:
              raise SystemExit("unexpected execute block")
          if "if result.status == ToolResultStatus::Failed" not in lines[start + 2]:
              raise SystemExit("execute failure transition not found")
          del lines[start + 2 : start + 6]

          code_line = next(i for i, line in enumerate(lines) if "AGENT_TOOL_NOT_FOUND," in line)
          return_line = code_line - 2
          if "return failed(" not in lines[return_line]:
              raise SystemExit("unknown-tool result constructor not found")
          lines[return_line] = lines[return_line].replace("return failed(", "return rejected(")

          error_start = next(i for i, line in enumerate(lines) if line.startswith("fn error_message("))
          rejected_start = next(
              i for i in range(error_start + 1, len(lines)) if lines[i].startswith("fn rejected(")
          )
          del lines[error_start:rejected_start]

          test_start = next(
              i for i, line in enumerate(lines) if "fn failed_calls_are_recorded_and_fail_the_session" in line
          ) - 1
          test_end = next(
              i for i in range(test_start + 2, len(lines)) if lines[i].strip() == "#[test]"
          )
          replacement = [
              "    #[test]\n",
              "    fn unknown_tools_are_rejected_recorded_and_do_not_stop_the_session() {\n",
              "        let mut host = host();\n",
              "        let mut session = session(PermissionSet::read_only());\n",
              "        let result = host.execute(\n",
              "            &mut session,\n",
              "            ToolCall {\n",
              "                id: \"call-missing\".into(),\n",
              "                tool: ToolId::from_static(\"missing.tool\"),\n",
              "                input: json!({}),\n",
              "                dry_run: false,\n",
              "            },\n",
              "        );\n",
              "        assert_eq!(result.status, ToolResultStatus::Rejected);\n",
              "        assert_eq!(error_code(&result), Some(AGENT_TOOL_NOT_FOUND));\n",
              "        assert_eq!(session.actions.len(), 1);\n",
              "        assert_eq!(session.status, SessionStatus::Running);\n",
              "        let following = host.execute(&mut session, list_call(\"call-after\"));\n",
              "        assert_eq!(following.status, ToolResultStatus::Ok);\n",
              "        assert_eq!(session.actions.len(), 2);\n",
              "    }\n",
              "\n",
          ]
          lines[test_start:test_end] = replacement
          host.write_text("".join(lines))

          editor = Path("crates/engine_editor/src/main.rs")
          lines = editor.read_text().splitlines(keepends=True)
          import_index = next(i for i, line in enumerate(lines) if "guiyi_engine_protocol" in line)
          lines[import_index] = lines[import_index].replace("decode_line, ", "")
          execute_start = next(i for i, line in enumerate(lines) if line.startswith("fn execute_line("))
          execute_end = next(
              i for i in range(execute_start + 1, len(lines)) if lines[i].startswith("type DocumentPaths")
          )
          replacement = [
              "fn execute_line(host: &mut AgentHost, session: &mut AgentSession, line: &str) -> ToolResult {\n",
              "    let value = match serde_json::from_str::<serde_json::Value>(line) {\n",
              "        Ok(value) => value,\n",
              "        Err(error) => {\n",
              "            return protocol_error(\"invalid\", \"PROTOCOL_INVALID_JSONL\", error.to_string())\n",
              "        }\n",
              "    };\n",
              "    let call_id = value\n",
              "        .get(\"id\")\n",
              "        .and_then(serde_json::Value::as_str)\n",
              "        .unwrap_or(\"invalid\")\n",
              "        .to_string();\n",
              "    match serde_json::from_value::<ToolCall>(value) {\n",
              "        Ok(call) => host.execute(session, call),\n",
              "        Err(error) => protocol_error(&call_id, \"PROTOCOL_INVALID_CALL\", error.to_string()),\n",
              "    }\n",
              "}\n",
              "\n",
              "fn protocol_error(call_id: &str, code: &str, message: String) -> ToolResult {\n",
              "    ToolResult {\n",
              "        call_id: call_id.into(),\n",
              "        status: ToolResultStatus::Rejected,\n",
              "        output: json!({\n",
              "            \"error\": {\n",
              "                \"code\": code,\n",
              "                \"message\": message\n",
              "            }\n",
              "        }),\n",
              "        diagnostics: Vec::new(),\n",
              "        transaction: None,\n",
              "    }\n",
              "}\n",
              "\n",
          ]
          lines[execute_start:execute_end] = replacement
          editor.write_text("".join(lines))
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit protocol changes
        run: |
          if git diff --quiet; then
            echo "protocol repair made no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(protocol): keep Workbench alive after tool errors"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
