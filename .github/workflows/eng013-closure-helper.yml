name: ENG-013 closure helper

on:
  push:
    branches:
      - feature/ENG-013-stage-object-move-remove

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/ENG-013-stage-object-move-remove
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Close ENG-013 backlog implementation status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/backlog/PRODUCT-BACKLOG.md")
          text = path.read_text()

          old_sequence = (
              "Current primary sequence:\n\n"
              "```text\n"
              "ENG-013 semantic Stage commands\n"
              "    ↓\n"
              "ENG-020..023 tactical RPG vertical\n"
              "    ↓\n"
              "ENG-030 Talos-driven playable-slice demo\n"
              "    ↓\n"
              "ENG-024 human review workbench\n"
              "```\n\n"
              "ENG-014 established the accepted Talos Runtime SDK baseline and ENG-012 established the incremental semantic Project Graph baseline for this sequence."
          )
          new_sequence = (
              "Current primary sequence:\n\n"
              "```text\n"
              "ENG-020..023 tactical RPG vertical\n"
              "    ↓\n"
              "ENG-030 Talos-driven playable-slice demo\n"
              "    ↓\n"
              "ENG-024 human review workbench\n"
              "```\n\n"
              "ENG-014 established the accepted Talos Runtime SDK baseline, ENG-012 established the incremental semantic Project Graph baseline, and ENG-013 established semantic Stage object move/remove authoring for the Agent-first development surface."
          )
          if text.count(old_sequence) != 1:
              raise SystemExit("primary sequence block did not match exactly once")
          text = text.replace(old_sequence, new_sequence, 1)

          old_story = (
              "## In Progress — Current implementation sequence\n\n"
              "### ENG-013 Stage object move/remove commands\n\n"
              "- Type: Tactical Toolkit / Command\n"
              "- Priority: P0\n"
              "- Status: In Progress\n"
              "- GitHub: [#57](https://github.com/wjhuang88/guiyi/issues/57) — implementation PR #58.\n"
              "- Depends on: ENG-014 / #52 and ENG-012 / #54 (Done).\n"
              "- Ownership: GUIYI tactical-RPG toolkit; no Talos-specific mutation path and no engine-core dependency on toolkit code.\n"
              "- Goal: add high-level `stage.move_object` and `stage.remove_object` Commands with dry-run, transaction diff, structured bounds/missing-object diagnostics, permission/working-set enforcement, and normal semantic-reference/Project-Graph refresh so Agent clients can make common Stage edits without file-level or GUI-only mutation.\n"
              "- Agent-first result: a normal Stage move/remove authoring task is a discoverable typed capability rather than an Editor-only gesture; a future visual Editor invokes the same authoritative Commands.\n"
              "- Compatibility: additive Tool IDs only; no Stage document or persistence-format migration.\n"
              "- Reference: `docs/reference/STAGE-MODEL.md`.\n"
              "- Evidence: `docs/validation/ENG-013.md`; final completion remains gated on current-head complete CI and merge of PR #58.\n"
          )
          new_story = (
              "## Done — Iteration 003 semantic Stage editing baseline\n\n"
              "### ENG-013 Stage object move/remove commands\n\n"
              "- Type: Tactical Toolkit / Command\n"
              "- Priority: P0\n"
              "- Status: Done\n"
              "- GitHub: [#57](https://github.com/wjhuang88/guiyi/issues/57) — implementation PR #58; merge remains gated on final clean-head CI.\n"
              "- Depends on: ENG-014 / #52 and ENG-012 / #54 (Done).\n"
              "- Ownership: GUIYI tactical-RPG toolkit; no Talos-specific mutation path and no engine-core dependency on toolkit code.\n"
              "- Goal/result: `stage.move_object` and `stage.remove_object` are live schema-bearing semantic Commands with normal dry-run, transaction diff, structured bounds/missing-object diagnostics, permission/working-set enforcement, audit behavior, and semantic-reference/Project-Graph refresh.\n"
              "- Agent-first result: a normal Stage move/remove authoring task is a discoverable typed capability rather than an Editor-only gesture; a future visual Editor invokes the same authoritative Commands.\n"
              "- Compatibility: additive Tool IDs only; no Stage document or persistence-format migration.\n"
              "- Reference: `docs/reference/STAGE-MODEL.md`.\n"
              "- Evidence: `docs/validation/ENG-013.md`; implementation-head CI run 228 (`40723376393`) passed the complete repository suite on `10fb887f0c82566863931c14fe222eba1d033147`. Final merge remains gated on green CI for the closure-synchronized current PR head.\n"
          )
          if text.count(old_story) != 1:
              raise SystemExit("ENG-013 backlog block did not match exactly once")
          text = text.replace(old_story, new_story, 1)
          path.write_text(text)
          PY
      - name: Commit closure synchronization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backlog/PRODUCT-BACKLOG.md
          git commit -m "docs(backlog): close ENG-013 implementation status"
          git push
