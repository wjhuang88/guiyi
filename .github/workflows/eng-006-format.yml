name: ENG-006 compiler repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/ENG-006-cargo-ci-baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply verified compiler repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/engine_query/src/lib.rs")
          source = path.read_text()
          old = "document.references.iter().filter_map(|reference| {"
          new = "document.references.iter().filter_map(move |reference| {"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one repair target, found {count}")
          path.write_text(source.replace(old, new, 1))
          PY
      - run: cargo fmt --all
      - name: Commit compiler repair
        run: |
          if git diff --quiet; then
            echo "repair made no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(query): own source in reference iterator"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
