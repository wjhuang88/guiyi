name: ENG-006 compiler repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/ENG-006-cargo-ci-baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply verified query repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/engine_query/src/lib.rs")
          source = path.read_text()
          old = '''        let input: ReferenceInput = serde_json::from_value(input.clone())?;
        let matches = store
            .iter()
            .flat_map(|(source, document)| {
                document.references.iter().filter_map(move |reference| {
                    let object_match = input.target_object.is_none()
                        || input.target_object == reference.target_object;
                    if reference.target_document == input.target_document && object_match {
                        Some(json!({
                            "source_document": source,
                            "source_object": reference.source_object,
                            "kind": reference.kind,
                            "target_object": reference.target_object
                        }))
                    } else {
                        None
                    }
                })
            })
            .collect::<Vec<_>>();
'''
          new = '''        let ReferenceInput {
            target_document,
            target_object,
        } = serde_json::from_value(input.clone())?;
        let matches = store
            .iter()
            .flat_map(|(source, document)| {
                let target_document = target_document.clone();
                let target_object = target_object.clone();
                document.references.iter().filter_map(move |reference| {
                    let object_match =
                        target_object.is_none() || target_object == reference.target_object;
                    if reference.target_document == target_document && object_match {
                        Some(json!({
                            "source_document": source,
                            "source_object": reference.source_object,
                            "kind": reference.kind,
                            "target_object": reference.target_object
                        }))
                    } else {
                        None
                    }
                })
            })
            .collect::<Vec<_>>();
'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one query block, found {count}")
          path.write_text(source.replace(old, new, 1))
          PY
      - run: cargo fmt --all
      - name: Commit compiler repair
        run: |
          if git diff --quiet; then
            echo "repair made no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(query): clone reference targets per source document"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
