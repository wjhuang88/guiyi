name: ENG-006 compiler repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/ENG-006-cargo-ci-baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply verified query repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/engine_query/src/lib.rs")
          lines = path.read_text().splitlines(keepends=True)
          start = next(
              index
              for index, line in enumerate(lines)
              if "let input: ReferenceInput = serde_json::from_value" in line
          )
          end = next(
              index
              for index in range(start, len(lines))
              if ".collect::<Vec<_>>();" in lines[index]
          )
          replacement = [
              "        let ReferenceInput {\n",
              "            target_document,\n",
              "            target_object,\n",
              "        } = serde_json::from_value(input.clone())?;\n",
              "        let matches = store\n",
              "            .iter()\n",
              "            .flat_map(|(source, document)| {\n",
              "                let target_document = target_document.clone();\n",
              "                let target_object = target_object.clone();\n",
              "                document.references.iter().filter_map(move |reference| {\n",
              "                    let object_match =\n",
              "                        target_object.is_none() || target_object == reference.target_object;\n",
              "                    if reference.target_document == target_document && object_match {\n",
              "                        Some(json!({\n",
              "                            \"source_document\": source,\n",
              "                            \"source_object\": reference.source_object,\n",
              "                            \"kind\": reference.kind,\n",
              "                            \"target_object\": reference.target_object\n",
              "                        }))\n",
              "                    } else {\n",
              "                        None\n",
              "                    }\n",
              "                })\n",
              "            })\n",
              "            .collect::<Vec<_>>();\n",
          ]
          lines[start : end + 1] = replacement
          path.write_text("".join(lines))
          PY
      - run: cargo fmt --all
      - name: Commit compiler repair
        run: |
          if git diff --quiet; then
            echo "repair made no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(query): clone reference targets per source document"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
