name: ENG-006 cargo repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/ENG-006-cargo-ci-baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fix --workspace --all-features --allow-dirty
      - run: cargo fmt --all
      - name: Commit compiler fixes
        run: |
          if git diff --quiet; then
            echo "cargo fix and cargo fmt made no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: apply compiler suggestions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
