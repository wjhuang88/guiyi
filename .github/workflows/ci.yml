name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch reviewed 2026-11-14
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 / 2.9.3
      - run: cargo metadata --locked --format-version 1
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo run -p guiyi-example-minimal-project --locked
      - run: cargo run -p guiyi-example-tactical-demo --locked
      - run: cargo run -p guiyi-example-mock-agent-workflow --locked

  repository-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python3 scripts/check_architecture.py
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/validate_repository.py
      - run: python3 scripts/static_rust_check.py
      - run: python3 scripts/check_reproducibility.py --self-test
      - run: python3 scripts/check_reproducibility.py
