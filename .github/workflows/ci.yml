name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eng014-maintenance-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Compile ENG-014 adapter
        run: cargo check -p guiyi-talos-runtime --tests
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        with:
          name: eng014-maintenance
          path: |
            Cargo.lock
            integrations/talos_runtime/src/lib.rs

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps
      - run: cargo run -p guiyi-example-minimal-project
      - run: cargo run -p guiyi-example-tactical-demo
      - run: cargo run -p guiyi-example-mock-agent-workflow

  repository-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 scripts/check_architecture.py
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/validate_repository.py
      - run: python3 scripts/static_rust_check.py
