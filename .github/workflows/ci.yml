name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eng014-correct-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/ENG-014-talos-runtime-integration
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Correct typed completion and recoverable domain failure assertions
        shell: python
        run: |
          from pathlib import Path
          path = Path("integrations/talos_runtime/src/lib.rs")
          text = path.read_text()
          text = text.replace(
              'assert_eq!(status, RuntimeTurnCompletionStatus::Completed);',
              'assert!(matches!(status, RuntimeTurnCompletionStatus::Success { .. }));',
          )
          old = '''            ProviderStep::Tool {
                id: "invalid",
                name: "project.document.get",
                input: json!({}),
            },'''
          new = '''            ProviderStep::Tool {
                id: "invalid",
                name: "project.document.get",
                input: json!({"id": "doc.missing"}),
            },'''
          text = text.replace(old, new)
          text = text.replace(
              '''        assert_eq!(invalid["status"], "rejected");
        assert_eq!(
            invalid["output"]["error"]["code"],
            "AGENT_ACCESS_PLAN_INVALID"
        );''',
              '''        assert_eq!(invalid["status"], "failed");
        assert_eq!(
            invalid["output"]["error"]["code"],
            "AGENT_TOOL_FAILED"
        );''',
          )
          path.write_text(text)
      - run: cargo fmt --all
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add integrations/talos_runtime/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "test(integration): align ENG-014 with Talos typed completion"
            git push origin HEAD:feature/ENG-014-talos-runtime-integration
          fi
      - run: cargo test -p guiyi-talos-runtime --all-features
