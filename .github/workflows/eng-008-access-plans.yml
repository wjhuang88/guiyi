name: ENG-008 tactical access plans

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/ENG-008-session-executor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Add tactical access plans
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("toolkits/tactical_rpg/tools/src/lib.rs")
          text = path.read_text()
          text = text.replace(
              "use guiyi_engine_core::{DocumentId, ObjectId, Permission, PermissionSet, ToolId};",
              "use guiyi_engine_core::{\n    DocumentAccessPlan, DocumentId, ObjectId, Permission, PermissionSet, ToolId,\n};",
              1,
          )

          replacements = [
              (
                  '''    fn validate(&self, input: &Value, state: &EngineState) -> DiagnosticBag {\n        let mut bag = DiagnosticBag::default();\n        match serde_json::from_value::<CreateStageInput>(input.clone()) {''',
                  '''    fn document_access(&self, input: &Value) -> Result<DocumentAccessPlan, CommandError> {\n        let input: CreateStageInput = serde_json::from_value(input.clone())?;\n        Ok(DocumentAccessPlan::document(input.id))\n    }\n\n    fn validate(&self, input: &Value, state: &EngineState) -> DiagnosticBag {\n        let mut bag = DiagnosticBag::default();\n        match serde_json::from_value::<CreateStageInput>(input.clone()) {''',
              ),
              (
                  '''    fn apply(&self, input: &Value, state: &mut EngineState) -> Result<Value, CommandError> {\n        let input: PlaceActorInput = serde_json::from_value(input.clone())?;''',
                  '''    fn document_access(&self, input: &Value) -> Result<DocumentAccessPlan, CommandError> {\n        let input: PlaceActorInput = serde_json::from_value(input.clone())?;\n        Ok(DocumentAccessPlan::documents([input.stage_id, input.definition]))\n    }\n\n    fn apply(&self, input: &Value, state: &mut EngineState) -> Result<Value, CommandError> {\n        let input: PlaceActorInput = serde_json::from_value(input.clone())?;''',
              ),
              (
                  '''    fn apply(&self, input: &Value, state: &mut EngineState) -> Result<Value, CommandError> {\n        let input: CreateSpawnInput = serde_json::from_value(input.clone())?;''',
                  '''    fn document_access(&self, input: &Value) -> Result<DocumentAccessPlan, CommandError> {\n        let input: CreateSpawnInput = serde_json::from_value(input.clone())?;\n        Ok(DocumentAccessPlan::document(input.stage_id))\n    }\n\n    fn apply(&self, input: &Value, state: &mut EngineState) -> Result<Value, CommandError> {\n        let input: CreateSpawnInput = serde_json::from_value(input.clone())?;''',
              ),
              (
                  '''    fn apply(&self, input: &Value, state: &mut EngineState) -> Result<Value, CommandError> {\n        let input: CreateTriggerInput = serde_json::from_value(input.clone())?;''',
                  '''    fn document_access(&self, input: &Value) -> Result<DocumentAccessPlan, CommandError> {\n        let input: CreateTriggerInput = serde_json::from_value(input.clone())?;\n        Ok(DocumentAccessPlan::document(input.stage_id))\n    }\n\n    fn apply(&self, input: &Value, state: &mut EngineState) -> Result<Value, CommandError> {\n        let input: CreateTriggerInput = serde_json::from_value(input.clone())?;''',
              ),
              (
                  '''    fn apply(&self, input: &Value, state: &mut EngineState) -> Result<Value, CommandError> {\n        let input: ConnectStageInput = serde_json::from_value(input.clone())?;''',
                  '''    fn document_access(&self, input: &Value) -> Result<DocumentAccessPlan, CommandError> {\n        let input: ConnectStageInput = serde_json::from_value(input.clone())?;\n        Ok(DocumentAccessPlan::documents([input.stage_id, input.to_stage]))\n    }\n\n    fn apply(&self, input: &Value, state: &mut EngineState) -> Result<Value, CommandError> {\n        let input: ConnectStageInput = serde_json::from_value(input.clone())?;''',
              ),
              (
                  '''    fn execute(&self, input: &Value, store: &DocumentStore) -> Result<Value, QueryError> {\n        let input: StageInput = serde_json::from_value(input.clone())?;\n        let document = store''',
                  '''    fn document_access(&self, input: &Value) -> Result<DocumentAccessPlan, QueryError> {\n        let input: StageInput = serde_json::from_value(input.clone())?;\n        Ok(DocumentAccessPlan::document(input.stage_id))\n    }\n\n    fn execute(&self, input: &Value, store: &DocumentStore) -> Result<Value, QueryError> {\n        let input: StageInput = serde_json::from_value(input.clone())?;\n        let document = store''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if old.startswith("    fn execute"):
                  if count != 2:
                      raise SystemExit(f"expected two Stage query targets, found {count}")
                  text = text.replace(old, new)
              else:
                  if count != 1:
                      raise SystemExit(f"expected one tactical target, found {count}")
                  text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit access plans
        run: |
          if git diff --quiet; then
            echo "access plans made no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(tactical-tools): declare document access plans"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
