name: ENG-011 clippy fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/ENG-011-crash-safe-storage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply gate fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path("crates/engine_content/src/lib.rs")
          text = lib.read_text()
          if text.count("pub use storage::*;") != 1:
              raise SystemExit("storage re-export not found")
          lib.write_text(text.replace("pub use storage::*;", "pub use self::storage::*;", 1))

          storage = Path("crates/engine_content/src/storage.rs")
          lines = storage.read_text().splitlines(keepends=True)
          counter = next(index for index, line in enumerate(lines) if "let mut operation_number = 0usize;" in line)
          loop = counter + 1
          if "for operation in journal.operations.iter().filter" not in lines[loop]:
              raise SystemExit("operation loop not found")
          lines[loop] = lines[loop].replace(
              "for operation in journal.operations.iter().filter(|item| !item.manifest)",
              "for (operation_number, operation) in journal.operations.iter().filter(|item| !item.manifest).enumerate()",
          )
          increment = next(index for index in range(loop, len(lines)) if "operation_number += 1;" in lines[index])
          del lines[increment]
          del lines[counter]
          storage.write_text("".join(lines))
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit gate fixes
        run: |
          if git diff --quiet; then
            echo "gate fixes made no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(storage): satisfy Clippy and module checks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
