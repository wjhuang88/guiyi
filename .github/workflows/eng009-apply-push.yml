name: ENG-009 branch implementation

on:
  push:
    branches:
      - agent/ENG-009-structured-jsonl-errors

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ENG-009-structured-jsonl-errors
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python3 scripts/eng009_run.py
      - run: cargo fmt --all
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(protocol): keep JSONL workbench alive after tool errors"
          git push origin HEAD:agent/ENG-009-structured-jsonl-errors
