name: ENG-020 closure helper

on:
  push:
    branches:
      - feature/ENG-020-navigation-reachability

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/ENG-020-navigation-reachability
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Synchronize backlog and iteration closure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          backlog = Path("docs/backlog/PRODUCT-BACKLOG.md")
          text = backlog.read_text()
          text = replace_once(
              text,
              "ENG-020..023 tactical RPG vertical",
              "ENG-021..023 tactical RPG vertical",
              "primary sequence",
          )
          text = replace_once(
              text,
              "ENG-014 established the accepted Talos Runtime SDK baseline, ENG-012 established the incremental semantic Project Graph baseline, and ENG-013 established semantic Stage object move/remove authoring for the Agent-first development surface.",
              "ENG-014 established the accepted Talos Runtime SDK baseline, ENG-012 established the incremental semantic Project Graph baseline, ENG-013 established semantic Stage object move/remove authoring, and ENG-020 established deterministic Stage navigation/reachability for the Agent-first development surface.",
              "primary sequence baseline sentence",
          )
          old = (
              "## Ready — Gate 3 tactical RPG vertical\n\n"
              "### ENG-020 Navigation and reachability validation\n\n"
              "- Type: Tactical Toolkit / Validation / Tools\n"
              "- Priority: P0\n"
              "- Status: In Progress\n"
              "- GitHub: [#59](https://github.com/wjhuang88/guiyi/issues/59).\n"
              "- Depends on: ENG-014 / #52, ENG-012 / #54, and ENG-013 / #57 (Done).\n"
              "- Primary ownership: GUIYI tactical-RPG toolkit (`content`, `validation`, `tools`); no engine-core or Talos-runtime ownership change.\n"
              "- North-star contribution: make Stage traversability inspectable, diagnosable, and repairable through machine-facing semantic capabilities so the Agent development surface does not depend on Editor-only navigation painting or inspection.\n"
              "- Scope: backward-compatible blocked-cell authoring data, deterministic Hex/Square reachability, structured navigation diagnostics, `stage.set_navigation_blocked`, and `stage.reachability`.\n"
              "- Machine-facing gate: live schema-bearing Command/Query discovery through the normal GUIYI catalog and ENG-014 Talos adapter, while direct clients remain Talos-independent.\n"
              "- Dependency direction: toolkit -> engine only; no new external dependency or Talos SDK/version/feature change.\n"
              "- Migration: existing Stage payloads remain readable through defaulted navigation data; no second navigation file or persisted graph truth.\n"
              "- Non-goals: runtime movement AI, terrain costs, dynamic occupancy/collision, LOS/cover/turn rules, navmesh generation, ENG-021/022/023, visual navigation UI, generic engine-core pathfinding.\n"
              "- Validation/rollback: Issue #59 is the implementation contract; full repository gates and clean-head CI are required, and rollback remains local to additive toolkit model/validation/tools/docs.\n"
          )
          new = (
              "## Done — Gate 3 navigation baseline\n\n"
              "### ENG-020 Navigation and reachability validation\n\n"
              "- Type: Tactical Toolkit / Validation / Tools\n"
              "- Priority: P0\n"
              "- Status: Done\n"
              "- GitHub: [#59](https://github.com/wjhuang88/guiyi/issues/59) — implementation PR #61; merge remains gated on final clean-head CI.\n"
              "- Depends on: ENG-014 / #52, ENG-012 / #54, and ENG-013 / #57 (Done).\n"
              "- Primary ownership: GUIYI tactical-RPG toolkit (`content`, `validation`, `tools`); no engine-core or Talos-runtime ownership change.\n"
              "- Result: `StageDocument` owns defaulted blocked-cell navigation authoring data; tactical content provides deterministic Hex/Square BFS; shared validation reports blocked-cell/spawn/unreachable diagnostics; `stage.set_navigation_blocked` and `stage.reachability` are live schema-bearing capabilities.\n"
              "- Agent-first result: navigation painting, traversability inspection, diagnostics, and repair are machine-facing semantic capabilities rather than Editor-only gestures. A future visual navigation client must use the same authoritative APIs.\n"
              "- Security/result: normal GUIYI permission and working-set checks remain authoritative through AgentHost; direct clients remain Talos-independent and the ENG-014 adapter discovers the live Tools automatically.\n"
              "- Migration: pre-ENG-020 Stage payloads remain readable through defaulted navigation data; no second navigation file or persisted graph truth.\n"
              "- Compatibility: additive Tool IDs only; command capability catalog grows from 10 to 11; no Talos SDK/version/feature or external dependency change.\n"
              "- Non-goals preserved: runtime movement AI, terrain costs, dynamic occupancy/collision, LOS/cover/turn rules, navmesh generation, ENG-021/022/023, visual navigation UI, generic engine-core pathfinding.\n"
              "- Reference: `docs/reference/STAGE-MODEL.md`.\n"
              "- Evidence: `docs/validation/ENG-020.md`; full integration CI run 243 (`41056886141`) passed on `4f5bc5ef9552fce17484ae8efc83dd699eb51f7b`. Final merge remains gated on green CI for the closure-synchronized clean head.\n"
          )
          text = replace_once(text, old, new, "ENG-020 backlog block")
          backlog.write_text(text)

          plan = Path("docs/iterations/iteration-003/PLAN.md")
          text = plan.read_text()
          text = replace_once(
              text,
              "- ENG-020 / #59 is In Progress on `feature/ENG-020-navigation-reachability` as the authorized Gate-3 tactical capability Story.",
              "- ENG-020 / #59 implementation acceptance is complete on `feature/ENG-020-navigation-reachability` through draft PR #61; merge remains gated on final closure-head CI.",
              "ENG-020 authorization",
          )
          text = replace_once(
              text,
              "## Active Story slice — ENG-020",
              "## Closing Story slice — ENG-020",
              "ENG-020 plan heading",
          )
          marker = "Issue #59 is the implementation contract and requires the complete repository suite plus final clean-head CI before Done/merge.\n\nAfter ENG-020 closes, ENG-021 is the preferred next Gate-3 capability candidate, but remains Proposed until separately promoted."
          replacement = (
              "Issue #59 is the implementation contract. The implementation now satisfies its content, validation, Command, Query, security, compatibility, and live-catalog scenarios.\n\n"
              "### Delivered ENG-020 work packages\n\n"
              "- defaulted `StageNavigation.blocked` data keeps legacy Stage payloads readable and is preserved in Stage artifact metadata;\n"
              "- deterministic BFS lives in tactical content for HexAxial/Square only, with fixed neighbor order, blocked/out-of-bounds exclusion, and explicit free-space unsupported behavior;\n"
              "- `validate_stage` reports `STAGE_NAV_BLOCKED_CELL_OUT_OF_BOUNDS`, `STAGE_NAV_DUPLICATE_BLOCKED_CELL`, `STAGE_NAV_SPAWN_BLOCKED`, `STAGE_OBJECT_UNREACHABLE`, and unsupported-coordinate-space diagnostics;\n"
              "- `stage.set_navigation_blocked` uses the normal schema/permission/access/dry-run/transaction/diff/audit/persistence path and rejects candidates that break reachability;\n"
              "- `stage.reachability` returns deterministic shortest path/distance, disconnected results, and structured missing-object/unsupported diagnostics;\n"
              "- AgentHost integration proves permission and working-set authority; live Tool catalog coverage proves both capabilities are machine-discoverable and therefore flow through the existing Talos adapter;\n"
              "- command capability golden grows from 10 to 11 Commands; no new external dependency or Talos change was introduced.\n\n"
              "### ENG-020 validation history\n\n"
              "- governance run 236 passed before Ready promotion merged;\n"
              "- core implementation run 238 (`41056355806`) passed the complete suite;\n"
              "- run 239 (`41056626414`) stopped at rustfmt after integration tests were added and is repair evidence only;\n"
              "- full integration run 243 (`41056886141`) on `4f5bc5ef9552fce17484ae8efc83dd699eb51f7b` passed fmt, check, strict Clippy, all workspace tests, doc, repository gates, and all three examples.\n\n"
              "Closure documentation changes the head. ENG-020 remains merge-gated until one final complete clean-head CI run succeeds after all temporary helpers are removed. Full evidence, compatibility, risks, and rollback are recorded in `docs/validation/ENG-020.md`.\n\n"
              "After ENG-020 closes, ENG-021 is the preferred next Gate-3 capability candidate, but remains Proposed until separately promoted."
          )
          text = replace_once(text, marker, replacement, "ENG-020 plan closure")
          plan.write_text(text)
          PY
      - name: Commit closure synchronization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backlog/PRODUCT-BACKLOG.md docs/iterations/iteration-003/PLAN.md
          git commit -m "docs(backlog): close ENG-020 implementation status"
          git push
