name: ENG-013 CLI golden helper

on:
  push:
    branches:
      - feature/ENG-013-stage-object-move-remove

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/ENG-013-stage-object-move-remove
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update expected command count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/engine_cli/src/main.rs")
          text = path.read_text()
          pattern = re.compile(
              r'(actual\.len\(\),\s*)8(,\s*"expected exactly )8( command schemas in the catalog")'
          )
          updated, count = pattern.subn(r'\g<1>10\g<2>10\g<3>', text, count=1)
          if count != 1:
              raise SystemExit(f"expected one CLI golden assertion, found {count}")
          path.write_text(updated)
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/engine_cli/src/main.rs
          git commit -m "test(cli): expect ENG-013 command schemas"
          git push
