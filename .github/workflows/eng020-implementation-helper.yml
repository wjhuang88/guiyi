name: ENG-020 implementation helper

on:
  push:
    branches:
      - feature/ENG-020-navigation-reachability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/ENG-020-navigation-reachability
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply source and contract updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import json

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one match, found {text.count(old)}")
              return text.replace(old, new, 1)

          content_insert = base64.b64decode("").decode()
          path_block = base64.b64decode("").decode()
          validation_fn = base64.b64decode("").decode()

          path = Path("toolkits/tactical_rpg/content/src/lib.rs")
          text = path.read_text()
          text = replace_once(text, "use std::collections::BTreeSet;", "use std::collections::{BTreeMap, BTreeSet, VecDeque};", "content imports")
          marker = "#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[serde(tag = \"kind\", rename_all = \"snake_case\")]\npub enum StageObjectKind"
          text = replace_once(text, marker, content_insert + "\n" + marker, "content navigation types")
          text = replace_once(
              text,
              "    pub coordinate_space: CoordinateSpace,\n    #[serde(default)]\n    pub layers: Vec<String>,",
              "    pub coordinate_space: CoordinateSpace,\n    #[serde(default)]\n    pub navigation: StageNavigation,\n    #[serde(default)]\n    pub layers: Vec<String>,",
              "StageDocument navigation field",
          )
          text = replace_once(
              text,
              "            coordinate_space: CoordinateSpace::HexAxial { width, height },\n            layers: vec![\"gameplay\".into()],",
              "            coordinate_space: CoordinateSpace::HexAxial { width, height },\n            navigation: StageNavigation::default(),\n            layers: vec![\"gameplay\".into()],",
              "new_hex navigation default",
          )
          text = replace_once(
              text,
              "                    \"coordinate_space\": stage.coordinate_space,\n                    \"connections\": stage.connections,",
              "                    \"coordinate_space\": stage.coordinate_space,\n                    \"navigation\": stage.navigation,\n                    \"connections\": stage.connections,",
              "artifact navigation metadata",
          )
          text = replace_once(
              text,
              "fn stage_position_in_bounds(space: &CoordinateSpace, position: HexCoord) -> bool {",
              path_block + "pub fn stage_position_in_bounds(space: &CoordinateSpace, position: HexCoord) -> bool {",
              "navigation path implementation",
          )
          path.write_text(text)

          path = Path("toolkits/tactical_rpg/validation/src/lib.rs")
          text = path.read_text()
          text = replace_once(
              text,
              "use tactical_rpg_content::{CoordinateSpace, StageDocument, StageObjectKind};",
              "use tactical_rpg_content::{\n    shortest_path, stage_position_in_bounds, CoordinateSpace, StageDocument, StageObjectKind,\n};",
              "validation imports",
          )
          start = text.index("pub fn validate_stage(stage: &StageDocument) -> DiagnosticBag {")
          end = text.index("\nfn position_in_bounds", start)
          text = text[:start] + validation_fn + text[end:]
          helper_start = text.index("\nfn position_in_bounds")
          helper_end = text.index("\n#[cfg(test)]", helper_start)
          text = text[:helper_start] + text[helper_end:]
          path.write_text(text)

          path = Path("toolkits/tactical_rpg/tools/src/lib.rs")
          text = path.read_text()
          text = replace_once(
              text,
              "mod stage_object_commands;\n\nuse crate::stage_object_commands::{MoveStageObjectCommand, RemoveStageObjectCommand};",
              "mod navigation;\nmod stage_object_commands;\n\nuse crate::navigation::{ReachabilityQuery, SetNavigationBlockedCommand};\nuse crate::stage_object_commands::{MoveStageObjectCommand, RemoveStageObjectCommand};",
              "tools navigation module",
          )
          text = replace_once(
              text,
              "    registry.register(RemoveStageObjectCommand)?;\n    registry.register(ConnectStageCommand)?;",
              "    registry.register(RemoveStageObjectCommand)?;\n    registry.register(SetNavigationBlockedCommand)?;\n    registry.register(ConnectStageCommand)?;",
              "register navigation command",
          )
          text = replace_once(
              text,
              "    registry.register(StageSummaryQuery)?;\n    Ok(())",
              "    registry.register(StageSummaryQuery)?;\n    registry.register(ReachabilityQuery)?;\n    Ok(())",
              "register reachability query",
          )
          path.write_text(text)

          path = Path("crates/engine_cli/src/main.rs")
          text = path.read_text()
          text = replace_once(
              text,
              "            actual.len(),\n            10,\n            \"expected exactly 10 command schemas in the catalog\"",
              "            actual.len(),\n            11,\n            \"expected exactly 11 command schemas in the catalog\"",
              "CLI command count",
          )
          path.write_text(text)

          path = Path("tests/fixtures/capabilities-command-schemas-v1.json")
          fixture = json.loads(path.read_text())
          fixture["stage.set_navigation_blocked"] = {
              "additionalProperties": True,
              "properties": {
                  "stage_id": {"type": "string", "x-schema-version": 1},
                  "q": {"type": "integer", "x-schema-version": 1},
                  "r": {"type": "integer", "x-schema-version": 1},
                  "blocked": {"type": "boolean", "x-schema-version": 1},
              },
              "required": ["stage_id", "q", "r", "blocked"],
              "type": "object",
              "x-schema-version": 1,
          }
          path.write_text(json.dumps(fixture, indent=2, sort_keys=True) + "\n")

          path = Path("docs/backlog/PRODUCT-BACKLOG.md")
          text = path.read_text()
          text = replace_once(
              text,
              "### ENG-020 Navigation and reachability validation\n\n- Type: Tactical Toolkit / Validation / Tools\n- Priority: P0\n- Status: Ready",
              "### ENG-020 Navigation and reachability validation\n\n- Type: Tactical Toolkit / Validation / Tools\n- Priority: P0\n- Status: In Progress",
              "ENG-020 backlog status",
          )
          path.write_text(text)

          path = Path("docs/iterations/iteration-003/PLAN.md")
          text = path.read_text()
          text = replace_once(text, "## Ready Story slice — ENG-020", "## Active Story slice — ENG-020", "ENG-020 plan status")
          text = replace_once(
              text,
              "- ENG-020 / #59 has passed the Direction Governance Ready checklist and is the next authorized Gate-3 tactical capability Story.",
              "- ENG-020 / #59 is In Progress on `feature/ENG-020-navigation-reachability` as the authorized Gate-3 tactical capability Story.",
              "ENG-020 authorization status",
          )
          path.write_text(text)
          PY
      - name: Format Rust changes
        run: cargo fmt --all
      - name: Commit implementation patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/engine_cli/src/main.rs tests/fixtures/capabilities-command-schemas-v1.json toolkits/tactical_rpg/content/src/lib.rs toolkits/tactical_rpg/validation/src/lib.rs toolkits/tactical_rpg/tools/src/lib.rs toolkits/tactical_rpg/tools/src/navigation.rs toolkits/tactical_rpg/content/tests/navigation.rs toolkits/tactical_rpg/validation/tests/navigation.rs docs/backlog/PRODUCT-BACKLOG.md docs/iterations/iteration-003/PLAN.md
          git commit -m "feat(tactical): implement ENG-020 navigation core"
          git push
