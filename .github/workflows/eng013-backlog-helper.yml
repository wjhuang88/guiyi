name: ENG-013 backlog helper

on:
  push:
    branches:
      - feature/ENG-013-stage-object-move-remove

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/ENG-013-stage-object-move-remove
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Synchronize backlog
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/backlog/PRODUCT-BACKLOG.md")
          text = path.read_text()

          replacements = [
              (
                  "GitHub Issue state was last synchronized on 2026-10-23.",
                  "GitHub Issue state was last synchronized on 2026-10-28.",
              ),
              (
                  "The current product proof is a real Talos-driven workflow over GUIYI's game-development capabilities.\n",
                  "The current product proof is a real Talos-driven workflow over GUIYI's game-development capabilities.\n\n"
                  "Product-surface goal: GUIYI is Agent-first rather than editor-first. The Agent interaction layer is the primary development and authoring surface and is intended to occupy the role a traditional game-engine Editor normally occupies in the development flow. Project understanding, semantic content edits, dry-run/diff review, diagnostics, validation, build, preview, and repair must be possible through machine-facing capabilities without requiring a GUI-only authoring gesture. A visual Editor is a secondary human client for review, inspection, debugging, visualization, approval, rollback, and exceptional intervention; it consumes the same Commands, Queries, transactions, diagnostics, and project truth rather than owning a second authoring model.\n",
              ),
              (
                  "- GitHub: [#54](https://github.com/wjhuang88/guiyi/issues/54) — implementation PR #55; final merge remains conditioned on clean-head CI for the closure-synchronized head.",
                  "- GitHub: [#54](https://github.com/wjhuang88/guiyi/issues/54) — completed by PR #55; squash merge `eed94d8d7d6a63b73c103198af1c33564ffa6bfe`.",
              ),
              (
                  "- Evidence: `docs/validation/ENG-012.md`; PR #55 CI run 204 (`39888285027`) passed the complete implementation suite on head `aefbfb0ee27055087913abd26af0611cc02f76ac`. Final merge remains gated on green CI for the closure-synchronized current PR head.",
                  "- Evidence: `docs/validation/ENG-012.md`; final clean-head PR #55 CI run 207 (`39888595677`) passed the complete suite before squash merge `eed94d8d7d6a63b73c103198af1c33564ffa6bfe`.",
              ),
              (
                  "## Ready — Current implementation sequence\n\n### ENG-013 Stage object move/remove commands\n\n- Status: Ready\n- Goal: add high-level commands with dry-run, transaction diff, and bounds diagnostics so Talos can make semantic Stage edits without file-level mutation.\n",
                  "## In Progress — Current implementation sequence\n\n### ENG-013 Stage object move/remove commands\n\n"
                  "- Type: Tactical Toolkit / Command\n"
                  "- Priority: P0\n"
                  "- Status: In Progress\n"
                  "- GitHub: [#57](https://github.com/wjhuang88/guiyi/issues/57) — implementation PR #58.\n"
                  "- Depends on: ENG-014 / #52 and ENG-012 / #54 (Done).\n"
                  "- Ownership: GUIYI tactical-RPG toolkit; no Talos-specific mutation path and no engine-core dependency on toolkit code.\n"
                  "- Goal: add high-level `stage.move_object` and `stage.remove_object` Commands with dry-run, transaction diff, structured bounds/missing-object diagnostics, permission/working-set enforcement, and normal semantic-reference/Project-Graph refresh so Agent clients can make common Stage edits without file-level or GUI-only mutation.\n"
                  "- Agent-first result: a normal Stage move/remove authoring task is a discoverable typed capability rather than an Editor-only gesture; a future visual Editor invokes the same authoritative Commands.\n"
                  "- Compatibility: additive Tool IDs only; no Stage document or persistence-format migration.\n"
                  "- Reference: `docs/reference/STAGE-MODEL.md`.\n"
                  "- Evidence: `docs/validation/ENG-013.md`; final completion remains gated on current-head complete CI and merge of PR #58.\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one backlog match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit backlog synchronization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backlog/PRODUCT-BACKLOG.md
          git commit -m "docs(backlog): synchronize ENG-012 and ENG-013 status"
          git push
