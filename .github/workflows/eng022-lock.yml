name: ENG-022 closure sync

on:
  push:
    branches:
      - feature/ENG-022-dialogue-rule-registry

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/ENG-022-dialogue-rule-registry
      - run: python3 .github/eng022_close.py
      - name: Commit closure docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: close ENG-022 implementation acceptance"
          git push origin HEAD:feature/ENG-022-dialogue-rule-registry
