          Path('docs/reference/DIALOGUE-MODEL.md').write_text('''# Dialogue model and tactical rule registry

## Purpose

ENG-022 adds a reusable tactical Dialogue graph and fulfills the existing Stage Trigger contract for registry-defined condition/effect invocations. GUIYI remains Agent-first: Dialogue authoring and rule discovery are semantic machine-facing capabilities; a future visual graph view is only a client of the same authoritative documents, Commands, Queries, diagnostics, transactions, and build path.

## Rule invocation contract

Conditions and effects keep one persisted JSON shape across Stage Triggers and Dialogue choices: an object containing a non-empty string `type` plus descriptor-specific fields. There is no Dialogue-only rule format and no second persisted registry truth.

`TacticalRuleRegistry` owns deterministic, distinct condition/effect namespaces. Descriptors contain ID, description, and a schema using GUIYI's existing `SchemaNode` dialect. Duplicate registration is rejected deterministically. The default registry contains:

- condition `always`: `{ "type": "always" }`;
- effect `emit_signal`: `{ "type": "emit_signal", "signal": <non-empty string> }`.

The registry validates authoring shape only; ENG-022 deliberately does not execute rules at runtime. Invocation failures map to shared diagnostics: `TACTICAL_RULE_TYPE_INVALID`, `TACTICAL_RULE_UNKNOWN`, and `TACTICAL_RULE_SCHEMA_INVALID`.

`tactical.rules.catalog` requires `Read`, declares no document access, and returns deterministic condition/effect descriptor arrays with IDs, descriptions, and machine-readable schemas. It is the canonical Agent discovery surface and is automatically exposed through the normal live catalog and ENG-014 Talos adapter.

## Dialogue authoring model

`DialogueDocument` contains stable document ID, name, `entry_node`, and authored `nodes`. `DialogueNode` contains stable `ObjectId`, speaker, text, and ordered choices. `DialogueChoice` contains stable `ObjectId`, text, optional target node ID, conditions, and effects. A null target is terminal.

Internal node/choice edges remain inside the Dialogue document and are not duplicated into a second graph truth. Stable authoring identity never depends on Bevy `Entity` IDs.

Document type: `tactical.dialogue.document`. Artifact type: `tactical.dialogue.artifact`.

## Validation

`validate_dialogue` is the shared candidate/build-facing validator. Blocking diagnostics are:

- `DIALOGUE_NAME_EMPTY`;
- `DIALOGUE_DUPLICATE_NODE_ID`;
- `DIALOGUE_ENTRY_NODE_NOT_FOUND`;
- `DIALOGUE_NODE_TEXT_EMPTY`;
- `DIALOGUE_DUPLICATE_CHOICE_ID`;
- `DIALOGUE_CHOICE_TEXT_EMPTY`;
- `DIALOGUE_CHOICE_TARGET_NOT_FOUND`;
- the shared `TACTICAL_RULE_*` errors.

`DIALOGUE_NODE_UNREACHABLE` is a warning so incremental authoring can add nodes before wiring every edge. Diagnostic locations retain document/object/field-path context for Agent repair.

## Semantic authoring Tools

`dialogue.create(dialogue_id, name, entry_node_id, speaker, text)` creates a valid document plus initial entry node in one transaction. `dialogue.add_node` adds one stable node. `dialogue.add_choice` adds one stable edge, permits a null target, validates source/target IDs, and validates conditions/effects through the shared registry.

All three Commands require `EditContent` and use the normal GUIYI schema, access-plan, permission, working-set, dry-run, transaction, diff, audit, persistence, and atomic validation path. There is no direct-file or Editor-private graph mutation path.

## Compiler and build

`DialogueCompiler` rejects blocking local structure/rule failures, preserves authored node/choice order and stable IDs, and emits a self-contained deterministic artifact containing name, entry node, nodes, choices, conditions, and effects through the standard `ArtifactEnvelope` source-hash/integrity path.

CLI/build registrations include Stage, Encounter, and Dialogue compilers. Strict build therefore produces all three tactical artifacts for valid project content and emits no partial artifacts when Dialogue/rule validation blocks the build. Actor definitions remain authoring-only where already configured.

## Compatibility and migration

Dialogue document/artifact types and Tool IDs are additive. Stage serialization and `stage.create_trigger` remain unchanged. Existing registered-valid `emit_signal` payloads remain valid. Previously unchecked malformed/unknown/schema-invalid rule invocations can now fail validation intentionally.

The only new dependency edge is tactical content -> internal `guiyi-engine-schema`; there is no new external dependency, no Talos SDK/version/feature change, and no engine crate depending on tactical toolkit code.

## Non-goals

ENG-022 does not add a runtime Dialogue VM, conversation session/presentation UI, localization/audio/cutscene sequencing, runtime condition/effect execution, world variables, quests, inventory/party/save-state semantics, game-specific rule expansion, a generic engine-core plugin registry, ENG-023 intent-level composition, or a visual Dialogue graph editor.

Executable acceptance and rollback evidence is recorded in `docs/validation/ENG-022.md`.
''')

          Path('docs/validation/ENG-022.md').write_text('''# ENG-022 validation — Dialogue graph and condition/effect registry

## Story

- Story: ENG-022
- GitHub Issue: #65
- Implementation PR: #68
- Branch: `feature/ENG-022-dialogue-rule-registry`
- Authorized implementation baseline: `7be300590847422ce2e4d683cd0f0ba00405c018`
- Promotion: PR #67 after complete CI run 271

## Product direction

This Story advances GUIYI's Agent-first development surface. Dialogue graph authoring, tactical rule discovery, candidate validation, build, and repair evidence are available through typed semantic capabilities. No Editor-only graph, private rule format, or Talos-specific mutation route is introduced.

## Implementation boundary

ENG-022 is contained in the tactical content/validation/tools crates plus existing CLI/example/golden integration. `tactical-rpg-content` reuses internal `guiyi-engine-schema`; reusable engine crates do not depend on tactical code. No external dependency or Talos SDK/version/feature change is introduced.

## Acceptance evidence

### Shared tactical rule registry

- deterministic distinct condition/effect namespaces;
- duplicate registration rejection;
- `SchemaNode` descriptor validation;
- built-ins `always` and backwards-compatible `emit_signal`;
- structured malformed/unknown/schema-invalid invocation diagnostics;
- deterministic `tactical.rules.catalog` machine-readable schemas.

### Stage Trigger compatibility

Existing Trigger serialization and `stage.create_trigger` schema are unchanged. Shared Stage validation now checks Trigger conditions/effects with Stage/trigger/field-path diagnostics. Tests prove historical valid `emit_signal` content remains valid and invalid rule candidates are rejected atomically.

### Dialogue model/compiler

Dialogue documents round-trip through `DocumentEnvelope`; stable node/choice IDs and authored ordering are preserved. Validation covers empty names/text, entry/target integrity, duplicate IDs, shared rules, and non-blocking unreachable warnings. `DialogueCompiler` uses the standard source-hash/integrity path and rejects blocking local failures.

### Semantic Commands and security

`dialogue.create`, `dialogue.add_node`, and `dialogue.add_choice` are schema-bearing live Commands. Tests cover dry-run reviewable diffs, apply, audit/transaction evidence, invalid target/rule atomicity, permission denial, and working-set denial. `tactical.rules.catalog` requires Read, declares no document access, and succeeds for restricted read-only sessions because it does not inspect project documents.

### Build, discovery, and executable proof

CLI recognizes Dialogue documents and registers Stage + Encounter + Dialogue compilers. Strict BuildPipeline tests prove all three artifacts are produced for valid content and no partial artifacts are emitted on blocking Dialogue/rule failure. The command golden grows from 14 to 17. The tactical demo authors Dialogue via semantic Commands and compiles it through the normal build path. Live ToolCatalog coverage proves the existing ENG-014 Talos adapter discovers the new Commands/Query without Talos-specific code.

## CI history

- Ready promotion: run 271 passed the complete suite before PR #67 merged.
- Early implementation CI stopped at rustfmt while files were being assembled; repository governance gates remained successful.
- Implementation head: run 290 (`41167411681`) on `f3c5d30b80d2061bb7652dcb96112655291c4cf1` passed repository gates, `cargo fmt`, workspace check, strict Clippy, all workspace tests, `cargo doc`, and all three executable examples.
- A branch-only helper then refreshed committed `Cargo.lock` for the new internal path dependency. The helper workflow is removed before final validation.
- Final clean-head complete-suite CI is required after closure docs/helper removal and before PR #68 merge.

No local Cargo gate is claimed; executable validation evidence comes from GitHub Actions.

## Compatibility / migration

Dialogue content and Tool IDs are additive. Stage document serialization is unchanged. Existing valid `emit_signal` rules remain compatible. Previously unchecked malformed, unregistered, or schema-invalid condition/effect payloads may now fail validation intentionally. No second graph/registry persistence truth exists.

## Risks / limitations

The registry validates authoring schema but ENG-022 does not define runtime evaluation/execution semantics. Dialogue artifacts are build outputs only; no conversation VM/session state is introduced. Rule expansion beyond the two minimum generic built-ins remains future game/toolkit work with explicit contracts.

## Rollback

Remove Dialogue content/compiler/validation/Commands/Query/tests/registrations/docs and the shared tactical rule registry integration, including the internal schema dependency/lock update. Existing Stage serialization requires no migration. Rollback must not replace these capabilities with an Editor-private Dialogue graph or alternate unchecked rule format.

## Follow-up

ENG-023 (`tactical.make_stage_playable`) is the preferred next Gate-3 capability, but remains Proposed and non-executable until separately promoted through Direction Governance.
''')
          PY

