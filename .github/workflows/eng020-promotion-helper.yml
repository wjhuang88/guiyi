name: ENG-020 promotion helper

on:
  push:
    branches:
      - docs/ENG-020-ready

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/ENG-020-ready
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Synchronize promotion documents
        run: |
          python3 - <<'PY'
          from pathlib import Path

          backlog = Path("docs/backlog/PRODUCT-BACKLOG.md")
          text = backlog.read_text()
          replacements = [
              (
                  "GitHub Issue state was last synchronized on 2026-10-28.",
                  "GitHub Issue state was last synchronized on 2026-10-30.",
              ),
              (
                  "- GitHub: [#57](https://github.com/wjhuang88/guiyi/issues/57) — implementation PR #58; merge remains gated on final clean-head CI.",
                  "- GitHub: [#57](https://github.com/wjhuang88/guiyi/issues/57) — completed by PR #58; squash merge `cb6c2a5016d04fd59e97926ae62b416bff6b41a0`.",
              ),
              (
                  "- Evidence: `docs/validation/ENG-013.md`; implementation-head CI run 228 (`40723376393`) passed the complete repository suite on `10fb887f0c82566863931c14fe222eba1d033147`. Final merge remains gated on green CI for the closure-synchronized current PR head.",
                  "- Evidence: `docs/validation/ENG-013.md`; final clean-head CI run 234 (`40724726043`) passed the complete suite on `5f7408fa55e7aad30824ed4bbae6d2e9faa230b9` before squash merge `cb6c2a5016d04fd59e97926ae62b416bff6b41a0`.",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"backlog replacement did not match once: {old[:80]!r}")
              text = text.replace(old, new, 1)

          ready = (
              "## Ready — Gate 3 tactical RPG vertical\n\n"
              "### ENG-020 Navigation and reachability validation\n\n"
              "- Type: Tactical Toolkit / Validation / Tools\n"
              "- Priority: P0\n"
              "- Status: Ready\n"
              "- GitHub: [#59](https://github.com/wjhuang88/guiyi/issues/59).\n"
              "- Depends on: ENG-014 / #52, ENG-012 / #54, and ENG-013 / #57 (Done).\n"
              "- Primary ownership: GUIYI tactical-RPG toolkit (`content`, `validation`, `tools`); no engine-core or Talos-runtime ownership change.\n"
              "- North-star contribution: make Stage traversability inspectable, diagnosable, and repairable through machine-facing semantic capabilities so the Agent development surface does not depend on Editor-only navigation painting or inspection.\n"
              "- Scope: backward-compatible blocked-cell authoring data, deterministic Hex/Square reachability, structured navigation diagnostics, `stage.set_navigation_blocked`, and `stage.reachability`.\n"
              "- Machine-facing gate: live schema-bearing Command/Query discovery through the normal GUIYI catalog and ENG-014 Talos adapter, while direct clients remain Talos-independent.\n"
              "- Dependency direction: toolkit -> engine only; no new external dependency or Talos SDK/version/feature change.\n"
              "- Migration: existing Stage payloads remain readable through defaulted navigation data; no second navigation file or persisted graph truth.\n"
              "- Non-goals: runtime movement AI, terrain costs, dynamic occupancy/collision, LOS/cover/turn rules, navmesh generation, ENG-021/022/023, visual navigation UI, generic engine-core pathfinding.\n"
              "- Validation/rollback: Issue #59 is the implementation contract; full repository gates and clean-head CI are required, and rollback remains local to additive toolkit model/validation/tools/docs.\n\n"
          )
          marker = "## Proposed — Synced GitHub issue intake\n"
          if text.count(marker) != 1:
              raise SystemExit("backlog insertion marker did not match once")
          text = text.replace(marker, ready + marker, 1)
          proposed = "- ENG-020 Navigation and reachability validation.\n"
          if text.count(proposed) != 1:
              raise SystemExit("ENG-020 proposed bullet did not match once")
          text = text.replace(proposed, "", 1)
          backlog.write_text(text)

          plan = Path("docs/iterations/iteration-003/PLAN.md")
          text = plan.read_text()
          replacements = [
              (
                  "- ENG-013 / #57 implementation acceptance is complete on branch `feature/ENG-013-stage-object-move-remove` through draft PR #58; merge remains gated on final closure-head CI.\n- ENG-020..023 remain outside the ENG-013 patch and become the next primary capability sequence after ENG-013 closes.\n- Proposed Stories remain non-executable.",
                  "- ENG-013 / #57 is Done and squash-merged through PR #58 (`cb6c2a5016d04fd59e97926ae62b416bff6b41a0`). Final clean-head CI run 234 passed before merge.\n- ENG-020 / #59 has passed the Direction Governance Ready checklist and is the next authorized Gate-3 tactical capability Story.\n- ENG-021..023 remain Proposed and non-executable until separately promoted.\n- Other Proposed Stories remain non-executable.",
              ),
              ("## Closing Story slice — ENG-013", "## Completed Story slice — ENG-013"),
              ("Draft PR: #58", "Merged PR: #58"),
              (
                  "- implementation-head run 228 (`40723376393`) on `10fb887f0c82566863931c14fe222eba1d033147` passed the complete suite, including all workspace tests, doc, repository gates, and all three configured examples.\n\nClosure documentation changes the branch head. PR #58 therefore remains draft and merge-gated until one final current clean-head CI run passes the same complete suite.",
                  "- implementation-head run 228 (`40723376393`) on `10fb887f0c82566863931c14fe222eba1d033147` passed the complete suite;\n- final clean-head run 234 (`40724726043`) on `5f7408fa55e7aad30824ed4bbae6d2e9faa230b9` passed the complete suite before PR #58 squash-merged as `cb6c2a5016d04fd59e97926ae62b416bff6b41a0`.",
              ),
              (
                  "The remaining merge gate is one complete green CI run on the final closure-synchronized head. No repository edit should be made solely to copy that final run number after it succeeds.\n\nAfter ENG-013 closes, the primary implementation sequence continues with ENG-020..023 tactical-RPG vertical capabilities, then ENG-030 Talos-driven playable-slice proof, then the human review workbench.",
                  "ENG-013 is fully closed.\n\n## Ready Story slice — ENG-020\n\n### ENG-020 Add tactical navigation map and reachability validation\n\nGitHub Issue: #59\n\nPrimary owner: GUIYI tactical-RPG toolkit.\n\nENG-020 is the first Gate-3 tactical vertical Story. It adds backward-compatible Stage blocked-cell authoring data, deterministic Hex/Square reachability, structured navigation diagnostics, the mutating `stage.set_navigation_blocked` Command, and the read-only `stage.reachability` Query. These capabilities must remain headless and live-catalog discoverable so Agent clients can perform the navigation authoring/inspection work a traditional Editor would otherwise mediate.\n\nThe Story explicitly excludes runtime movement AI, terrain costs, dynamic occupancy/collision, LOS/cover/turn rules, navmesh generation, visual navigation UI, generic engine-core pathfinding, and ENG-021/022/023 scope. No Talos SDK change or new external dependency is expected. Existing Stage payloads remain readable through defaulted navigation data.\n\nIssue #59 is the implementation contract and requires the complete repository suite plus final clean-head CI before Done/merge.\n\nAfter ENG-020 closes, ENG-021 is the preferred next Gate-3 capability candidate, but remains Proposed until separately promoted.",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"plan replacement did not match once: {old[:80]!r}")
              text = text.replace(old, new, 1)
          plan.write_text(text)
          PY
      - name: Commit synchronized docs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backlog/PRODUCT-BACKLOG.md docs/iterations/iteration-003/PLAN.md
          git commit -m "docs(backlog): promote ENG-020 to Ready"
          git push
