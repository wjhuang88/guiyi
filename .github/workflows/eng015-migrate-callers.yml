name: ENG-015 caller migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/ENG-015-reject-tool-id-collisions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python3 scripts/eng015_update_callers.py
      - run: cargo fmt --all
      - name: Commit caller migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "refactor(agent-tools): propagate catalog construction errors"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
