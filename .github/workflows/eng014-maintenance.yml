name: ENG-014 branch maintenance

on:
  push:
    branches: [feature/ENG-014-talos-runtime-integration]

permissions:
  contents: write

jobs:
  format-lock-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/ENG-014-talos-runtime-integration
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Compile adapter and retain formatting/lockfile
        shell: bash
        run: |
          set +e
          cargo check -p guiyi-talos-runtime --tests
          status=$?
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock integrations/talos_runtime/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "chore(integration): format adapter and lock Talos dependencies"
            git push origin HEAD:feature/ENG-014-talos-runtime-integration
          fi
          exit $status
