name: ENG-030 Temporary Rustfmt Source Export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'feature/ENG-030-talos-playable-slice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and export source
        run: |
          cargo fmt --all
          echo 'ENG030_FORMAT_START_LIB'
          cat examples/talos_playable_slice/src/lib.rs
          echo 'ENG030_FORMAT_END_LIB'
          echo 'ENG030_FORMAT_START_MAIN'
          cat examples/talos_playable_slice/src/main.rs
          echo 'ENG030_FORMAT_END_MAIN'
