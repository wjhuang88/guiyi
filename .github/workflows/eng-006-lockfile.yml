name: ENG-006 lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/ENG-006-cargo-ci-baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - name: Commit Cargo.lock
        run: |
          if [ -z "$(git status --porcelain -- Cargo.lock)" ]; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: commit resolved Cargo lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
