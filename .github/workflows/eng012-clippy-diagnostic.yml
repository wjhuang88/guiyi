name: ENG-012 clippy diagnostic

on:
  push:
    branches:
      - feature/ENG-012-project-graph-index

permissions:
  contents: read

jobs:
  clippy-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Capture clippy output
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings > eng012-clippy.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eng012-clippy-log
          path: eng012-clippy.log
