name: ENG-009 implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/ENG-009-structured-jsonl-errors'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Make implementation script idempotent
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/eng009_apply.py")
          text = path.read_text()
          text = text.replace(
              '''    count = text.count(old)
    if count != 1:
        raise SystemExit(f"{path}: expected one replacement target, found {count}")
    target.write_text(text.replace(old, new, 1))
''',
              '''    count = text.count(old)
    if count == 1:
        target.write_text(text.replace(old, new, 1))
        return
    if count == 0 and new in text:
        return
    raise SystemExit(f"{path}: expected one replacement target, found {count}")
''',
              1,
          )
          text = text.replace(
              '''    count = section.count(old)
    if count != 1:
        raise SystemExit(f"{path}: expected one section target, found {count}")
    section = section.replace(old, new, 1)
    target.write_text(text[:start] + section + text[end:])
''',
              '''    count = section.count(old)
    if count == 1:
        section = section.replace(old, new, 1)
        target.write_text(text[:start] + section + text[end:])
        return
    if count == 0 and new in section:
        return
    raise SystemExit(f"{path}: expected one section target, found {count}")
''',
              1,
          )
          path.write_text(text)
          PY
      - run: python3 scripts/eng009_apply.py
      - run: cargo fmt --all
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(protocol): keep JSONL workbench alive after tool errors"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
